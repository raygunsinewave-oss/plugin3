name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds publish a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel runner cross-compiles the same Universal (arm64 + x86_64) binary; the Apple-Silicon
          # pool never acquired a machine for this account.
          - name: macOS (Universal, Intel runner)
            os: macos-15-intel
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          - name: Windows (x64)
            os: windows-latest
            cmake_args: -A x64
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          - name: Linux (x64)
            os: ubuntu-24.04
            cmake_args: -G Ninja
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MBX_SKIP_PERF: "1"
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev libfreetype-dev \
            libfontconfig1-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build\MysteryBoxTests_artefacts\Release\MysteryBoxTests.exe"
          & $bin
          $code = $LASTEXITCODE
          Write-Host ("Exit code: {0} (0x{1:X8})" -f $code, $code)
          exit $code

      - name: Unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RUN=""
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; fi
          BIN=""
          for c in build/MysteryBoxTests_artefacts/*/MysteryBoxTests.exe build/MysteryBoxTests_artefacts/*/MysteryBoxTests; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          echo "Running $BIN"
          $RUN "$BIN"

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          VST3=$(ls -d build/MysteryBox_artefacts/*/VST3/"Mystery Box.vst3" | head -1)
          case "$RUNNER_OS" in
            macOS)   PV=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) PV=./pluginval.exe ;;
            *)       PV="xvfb-run -a ./pluginval" ;;
          esac
          $PV --strictness-level 10 --validate-in-process --timeout-ms 900000 "$VST3"

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          AU=$(ls -d build/MysteryBox_artefacts/Release/AU/"Mystery Box.component")
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/"Mystery Box.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aumu MyBx Rygn

      - name: Import signing certificates (macOS, optional)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

      - name: Package (macOS .pkg + zip)
        if: runner.os == 'macOS'
        env:
          MACOS_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          MACOS_APP_ID: ${{ secrets.MACOS_APP_ID }}
        run: |
          VERSION=$(grep -m1 'project(MysteryBox VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          packaging/macos/build_pkg.sh build "$VERSION" "${MACOS_INSTALLER_ID:-}" "${MACOS_APP_ID:--}"

      - name: Notarize (macOS, optional)
        if: runner.os == 'macOS' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          PKG=$(ls MysteryBox-*-macOS.pkg)
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MysteryBox VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DVersion=$v" "/DArtefacts=$PWD\build\MysteryBox_artefacts\Release" "/O$PWD" packaging\windows\MysteryBox.iss

      - name: Copy manual
        shell: bash
        run: cp docs/MANUAL.md "MysteryBox-Manual.md"

      - uses: actions/upload-artifact@v4
        with:
          name: MysteryBox-${{ runner.os }}-${{ matrix.os }}
          path: |
            MysteryBox-*.pkg
            MysteryBox-*.zip
            MysteryBox-*-Setup.exe
            MysteryBox-Manual.md
            build/MysteryBox_artefacts/Release/VST3
            build/MysteryBox_artefacts/Release/Standalone
          if-no-files-found: warn

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MysteryBox-*.pkg
            MysteryBox-*.zip
            MysteryBox-*-Setup.exe
            MysteryBox-Manual.md
          fail_on_unmatched_files: false

  sanitizers:
    name: Linux tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    env:
      MBX_SKIP_PERF: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libgl1-mesa-dev libfreetype-dev libfontconfig1-dev xvfb
      - name: Build tests with sanitizers
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMYSTERYBOX_SANITIZE=ON
          cmake --build build-asan --target MysteryBoxTests --parallel 4
      - name: Run
        run: ASAN_OPTIONS=detect_leaks=0 xvfb-run -a build-asan/MysteryBoxTests_artefacts/RelWithDebInfo/MysteryBoxTests
